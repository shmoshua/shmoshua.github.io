<h3 class="numbered"> TV distance and $\chi^2$ distance</h3>
By Cauchy-Schwarz, 

$$
    \tv(p,q)\le \frac{1}{2}\sqrt{\int \frac{(p(x)-q(x))^2}{q(x)}dx}\sqrt{\int q(x)dx}=\frac{1}{2}\chi^2(p\|q)
$$
