<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · {{ site.title }}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">

  <script>
    window.MathJax = {
      tex: { inlineMath: [['\\(', '\\)'], ['$', '$']], displayMath: [['$$', '$$'], ['\\[', '\\]']], tags: 'all' },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>

<body>
<!-- Filled in automatically from the h2/h3 headings by js/toc.js -->
<nav class="toc" aria-label="Contents"></nav>

<header class="masthead article">
  {% if page.topic %}<p class="eyebrow">{{ page.topic }}</p>{% endif %}
  <h1 class="title">{{ page.title }}</h1>
  {% if page.authors %}<p class="authors">{{ page.authors }}</p>{% endif %}
  <p class="affil">Read {{ page.date | date: "%b %d, %Y" }} · <a href="{{ '/' | relative_url }}">← Back to all notes</a></p>
  {% if page.paper %}<div class="links"><a href="{{ page.paper }}">Paper <span class="arr">↗</span></a></div>{% endif %}
</header>

<article class="article">
{{ content }}
</article>

<footer class="article">
  <p>{{ site.title }} · ETH Zurich</p>
</footer>

<script src="{{ '/js/toc.js' | relative_url }}"></script>
</body>
</html>
