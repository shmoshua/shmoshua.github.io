title: Master Thesis Notes

# Each file in _posts/ becomes /posts/YYYY-MM-DD-name.html
permalink: /posts/:year-:month-:day-:title:output_ext

exclude:
  - README.md

# One page per model (SK, SBM, ...) in _models/, published at /models/<file-name>/
collections:
  models:
    output: true
    permalink: /models/:name/
