title: Master Thesis Notes

# Each file in _posts/ becomes /posts/YYYY-MM-DD-name.html
permalink: /posts/:year-:month-:day-:title:output_ext

exclude:
  - README.md
  - "*.patch"

# The site has three sections (names and order in _data/sections.yml):
#   Reading List  -> _posts/     (one post per paper)
#   Attempts      -> _attempts/  (one page per idea, with a dated log of how it develops)
#   Notes         -> _notes/     (concepts, models and summaries to look things up in)
collections:
  attempts:
    output: true
    permalink: /attempts/:name/
  notes:
    output: true
    permalink: /notes/:name/

# Every page in _attempts/ and _notes/ uses the same layout as the posts
defaults:
  - scope: { path: "", type: attempts }
    values: { layout: post }
  - scope: { path: "", type: notes }
    values: { layout: post }
